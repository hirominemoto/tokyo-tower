<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京タワー、見上げる場所</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; overflow: hidden; background: #000; cursor: pointer;
    font-family: "Meiryo", "Meiryo UI", "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Sans", sans-serif; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.42) 100%); }
  #cap { position: absolute; left: 0; right: 0; bottom: 7%; text-align: center; color: #f4efe8;
    font-size: 2.7em; letter-spacing: 0.14em; font-weight: 400; opacity: 0; pointer-events: none;
    text-shadow: 0 0 0.5em rgba(0,0,0,0.85), 0 0 0.15em rgba(0,0,0,0.9); }
  #title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 7%; box-sizing: border-box;
    color: #fbf6ef; opacity: 0; pointer-events: none; text-shadow: 0 0 0.6em rgba(0,0,0,0.7); }
  #title .t1 { font-size: 5.2em; letter-spacing: 0.32em; padding-left: 0.32em; font-weight: 400; }
  #title .t1 span { color: #ff6a46; }
  #title .t2 { margin-top: 1.1em; font-size: 1.9em; letter-spacing: 0.22em; opacity: 0; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; height: 3.2em; display: flex; align-items: center; gap: 1em;
    padding: 0 1.4em; opacity: 0; transition: opacity .3s; background: linear-gradient(transparent, rgba(0,0,0,.55)); }
  #stage:hover #ui { opacity: 1; }
  #play { color: #fff; background: none; border: 0; font-size: 1.3em; cursor: pointer; width: 2em; font-family: inherit; }
  #track { flex: 1; height: 0.3em; background: rgba(255,255,255,.25); border-radius: 1em; cursor: pointer; }
  #bar { height: 100%; width: 0; background: #ff6a46; border-radius: 1em; }
  #mute { color: #fff; background: none; border: 0; font-size: 1.15em; cursor: pointer; width: 2em; font-family: inherit; opacity: .9; }
  #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4em;
    background: rgba(6,6,14,.5); color: #fbf6ef; transition: opacity .5s; }
  #start .pb { width: 6.4em; height: 6.4em; border-radius: 50%; border: 0.12em solid rgba(251,246,239,.85); display: flex; align-items: center; justify-content: center; }
  #start .pb::after { content: ""; margin-left: 0.5em; border-style: solid; border-width: 1.2em 0 1.2em 2em; border-color: transparent transparent transparent #fbf6ef; }
  #start .pl { font-size: 1.5em; letter-spacing: 0.2em; opacity: .85; }
  #start.gone { opacity: 0; pointer-events: none; }
  .render #ui, .render #start { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="cap"></div>
  <div id="title"><div class="t1">東京タワー</div><div class="t2">見上げる場所の数だけ、顔がある。</div></div>
  <div id="fade"></div>
  <div id="start"><div class="pb"></div><div class="pl">クリックで再生（音楽が流れます）</div></div>
  <div id="ui"><button id="play" aria-label="再生／一時停止">▶</button><div id="track"><div id="bar"></div></div><button id="mute" aria-label="音のオン／オフ">♪</button></div>
</div>
<script>if (location.search.indexOf('render') >= 0) document.body.classList.add('render');</script>
<script>window.__BGM = "/*__AUDIO__*/";</script>
<script type="module">/*__BUNDLE__*/</script>
</body>
</html>
